[project]
name = "kaolin-shim"
version = "0.0.1"
description = "Minimal stand-in for kaolin.utils.testing.check_tensor. NOT NVIDIA Kaolin."
requires-python = ">=3.9"
dependencies = ["torch"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kaolin", "kaolin.utils"]
