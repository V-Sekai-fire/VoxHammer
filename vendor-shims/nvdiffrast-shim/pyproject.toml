[project]
name = "nvdiffrast-shim"
version = "0.0.1"
description = "Import-only stand-in for nvdiffrast. Raises on use. NOT NVlabs nvdiffrast."
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nvdiffrast", "nvdiffrast.torch"]
